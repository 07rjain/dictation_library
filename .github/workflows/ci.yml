name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.node-version == 22
        name: Verify long-audio routing above 25 MiB and 100 MiB
        run: npm run benchmark:long
      - run: npm audit --audit-level=high
      - if: matrix.node-version == 20
        run: npm pack --dry-run --cache /tmp/npm-release-cache
