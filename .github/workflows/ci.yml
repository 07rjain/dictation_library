name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic regression suite
        run: npm run test:regression
      - if: matrix.node-version == 24
        name: Verify long-audio routing above 25 MiB and 100 MiB
        run: npm run benchmark:long
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - if: matrix.node-version == 22
        name: Verify public package contents
        run: npm pack --dry-run --cache /tmp/npm-release-cache
