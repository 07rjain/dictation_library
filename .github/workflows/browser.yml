name: Browser recorder

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cross-browser:
    name: cross-browser (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium-linux
            runner: ubuntu-latest
            install: npx playwright install --with-deps chromium
            projects: --project=chromium --project=chromium-android
          - name: firefox-webkit-macos
            runner: macos-14
            install: npx playwright install firefox webkit
            projects: --project=firefox --project=webkit-ios
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtimes
        run: ${{ matrix.install }}
      - name: Exercise MediaRecorder rotation and decoding
        run: npm run test:browser -- ${{ matrix.projects }}
