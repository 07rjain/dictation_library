name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/assemble-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install the published package
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          mkdir -p /tmp/dictation-package
          npm install --prefix /tmp/dictation-package --ignore-scripts --no-audit --no-fund "groq-dictation-kit@$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Assemble Pages artifact with the published ESM library
        run: node scripts/assemble-pages.mjs /tmp/dictation-pages "$GITHUB_SHA" /tmp/dictation-package/node_modules/groq-dictation-kit/dist "$PACKAGE_VERSION"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/dictation-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
